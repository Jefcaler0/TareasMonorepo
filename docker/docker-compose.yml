#version: "3.9"

services:
  sqlserver:
    container_name: tareas-mssql
    build:
      context: /Users/jcano/Documents/TareasMonorepo
      dockerfile: docker/mssql.Dockerfile
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - /Users/jcano/Documents/TareasMonorepo/scripts_db:/var/opt/mssql/scripts:ro
    networks:
      - tareas-network

volumes:
  sqlserver-data:

networks:
  tareas-network:

